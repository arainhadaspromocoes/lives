<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lives da Rainha 👑 | A Rainha das Promoções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --azul:#3A4BD8;
    --tinta:#15151F;
    --papel:#F2F1EA;
    --amarelo:#F5C518;
    --lilas:#A99DF5;
    --verde:#5FD68F;
    --rosa:#F2557C;
    --rosa-claro:#FFD3DE;
    --teal:#0F9D8F;
    --borda:2.4px solid var(--tinta);
    --sombra-g:6px 6px 0 0 var(--tinta);
    --sombra-m:4px 4px 0 0 var(--tinta);
    --sombra-p:2px 2px 0 0 var(--tinta);
    --raio:12px;
    --raio-btn:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background-color:var(--azul);
    background-image:
      linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
    background-size:30px 30px;
    color:var(--tinta);
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}

  /* estrelinhas decorativas */
  .estrela{position:fixed;font-size:26px;z-index:0;pointer-events:none;opacity:.95;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .e1{top:9%;left:5%}.e2{top:22%;right:6%;font-size:32px}.e3{bottom:18%;left:7%}.e4{bottom:30%;right:5%;font-size:20px}

  .container{max-width:560px;margin:0 auto;padding:22px 16px 40px;position:relative;z-index:1}

  /* ===== Janela (card base) ===== */
  .janela{
    background:var(--papel);
    border:var(--borda);
    border-radius:var(--raio);
    box-shadow:var(--sombra-g);
    overflow:hidden;
    margin-bottom:20px;
  }
  .barra{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;
    border-bottom:var(--borda);
    font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  }
  .barra-lilas{background:var(--lilas)}
  .barra-verde{background:var(--verde)}
  .barra-amarela{background:var(--amarelo)}
  .barra-rosa{background:var(--rosa-claro)}
  .barra .controles{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;opacity:.85}
  .janela .corpo{padding:16px}

  /* ===== Título grande estilo hero ===== */
  .hero-titulo{
    text-align:center;font-weight:700;color:var(--azul);
    font-size:30px;line-height:1.25;letter-spacing:.5px;
  }
  .marca-texto{
    display:inline-block;background:var(--amarelo);color:var(--azul);
    padding:2px 12px;border-radius:10px;box-shadow:3px 3px 0 0 var(--tinta);
  }
  .hero-sub{
    text-align:center;font-size:14.5px;margin-top:12px;line-height:1.5;
  }
  .hero-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--papel);border:var(--borda);border-radius:var(--raio-btn);
    box-shadow:var(--sombra-m);
    font-size:12.5px;font-weight:700;padding:8px 12px;
    transition:transform .1s, box-shadow .1s;
  }
  .chip-amarelo{background:var(--amarelo)}
  .chip-lilas{background:var(--lilas)}
  .hero-aviso{text-align:center;font-weight:700;font-size:13.5px;margin-top:16px}

  /* ===== Botões ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:var(--borda);border-radius:var(--raio-btn);
    box-shadow:var(--sombra-m);
    font-size:14px;font-weight:700;
    padding:11px 16px;
    transition:transform .1s, box-shadow .1s;
    background:var(--papel);
  }
  .btn:active{transform:translate(3px,3px);box-shadow:var(--sombra-p)}
  .btn-amarelo{background:var(--amarelo)}
  .btn-lilas{background:var(--lilas)}
  .btn-verde{background:var(--verde)}
  .btn-rosa{background:var(--rosa-claro);color:#B4133F}
  .btn-bloco{width:100%}
  .btn-mini{padding:7px 11px;font-size:12.5px;box-shadow:var(--sombra-p)}
  .btn-mini:active{transform:translate(2px,2px);box-shadow:none}

  /* ===== Home: lista de lives ===== */
  .titulo-secao{
    color:#fff;font-size:19px;font-weight:700;margin:6px 0 14px;
    text-shadow:2px 2px 0 rgba(0,0,0,.3);
  }
  .card-live{display:block;transition:transform .1s}
  .card-live:active{transform:translate(2px,2px)}
  .card-live .corpo{display:flex;align-items:center;gap:14px;padding:14px 16px}
  .card-live .icone{
    width:48px;height:48px;border:var(--borda);border-radius:10px;
    background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;box-shadow:var(--sombra-p);
  }
  .card-live .info{flex:1;min-width:0}
  .card-live .titulo{font-size:16px;font-weight:700;line-height:1.3}
  .card-live .meta{font-size:13px;margin-top:3px;opacity:.75;font-weight:500}
  .card-live .seta{font-size:22px;font-weight:700;flex-shrink:0}

  .vazio{
    text-align:center;padding:36px 20px;font-size:14.5px;font-weight:500;
  }
  .vazio .emoji{font-size:44px;margin-bottom:12px}

  /* ===== Página da live ===== */
  .faixa-live{text-align:center}
  .faixa-live .corpo{padding:18px 16px}
  .faixa-live .tag{
    display:inline-block;background:var(--rosa);color:#fff;
    border:var(--borda);border-radius:100px;box-shadow:var(--sombra-p);
    font-size:11.5px;font-weight:700;letter-spacing:.8px;
    padding:4px 12px;text-transform:uppercase;
  }
  .faixa-live h2{font-size:21px;font-weight:700;margin-top:10px;line-height:1.3}
  .faixa-live .data{font-size:13.5px;margin-top:5px;opacity:.7;font-weight:500}

  .grade{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card-produto{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-m);overflow:hidden;
    display:flex;flex-direction:column;margin-bottom:0;
  }
  .card-produto .barra{font-size:10.5px;padding:5px 9px}
  .card-produto .barra .controles{font-size:10.5px;gap:5px}
  .card-produto .foto{
    width:100%;aspect-ratio:1/1;background:#fff;
    display:flex;align-items:center;justify-content:center;
    border-bottom:var(--borda);overflow:hidden;
  }
  .card-produto .foto img{width:100%;height:100%;object-fit:contain}
  .card-produto .corpo{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1;gap:9px}
  .card-produto .nome{
    font-size:13px;line-height:1.35;font-weight:500;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .btn-comprar{
    display:block;text-align:center;
    background:var(--lilas);
    border:var(--borda);border-radius:var(--raio-btn);
    box-shadow:var(--sombra-p);
    font-size:13.5px;font-weight:700;
    padding:10px 0;
    transition:transform .1s, box-shadow .1s;
  }
  .btn-comprar:active{transform:translate(2px,2px);box-shadow:none}

  /* ===== Cupom da live ===== */
  .use-cupom{
    font-size:27px;font-weight:700;letter-spacing:1.5px;color:var(--azul);
  }
  .caixa-cupom{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:2.4px dashed var(--tinta);border-radius:10px;background:#fff;
    padding:8px 8px 8px 16px;margin-top:12px;
  }
  .codigo-cupom{font-weight:700;font-size:19px;letter-spacing:1.5px;word-break:break-all}
  .btn-cupom{
    display:block;width:100%;text-align:center;
    border:2px dashed var(--tinta);border-radius:8px;background:#fff;
    font-weight:700;font-size:12px;padding:8px 0;letter-spacing:.5px;
    transition:transform .1s;
  }
  .btn-cupom:active{transform:scale(.97)}

  .rodape{
    text-align:center;padding:10px 16px 30px;font-size:13px;color:#fff;font-weight:600;
    text-shadow:1px 1px 0 rgba(0,0,0,.3);position:relative;z-index:1;
  }
  .rodape a{text-decoration:underline;text-underline-offset:3px}

  /* ===== Admin ===== */
  .painel-secao{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-g);margin-bottom:20px;overflow:hidden;
  }
  .painel-secao .conteudo{padding:16px}
  .painel-secao h3{font-size:15px;font-weight:700;margin-bottom:12px}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:12px;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .campo input{
    width:100%;padding:11px 12px;font-size:14px;font-weight:500;
    border:var(--borda);border-radius:var(--raio-btn);
    outline:none;background:#fff;color:var(--tinta);
    transition:box-shadow .1s;
  }
  .campo input:focus{box-shadow:var(--sombra-p)}
  .campo input::placeholder{color:#999;font-weight:400}

  .linha-live-admin{
    display:flex;align-items:center;gap:10px;
    padding:12px 0;border-bottom:2px dashed #d8d6c9;
  }
  .linha-live-admin:last-child{border-bottom:none;padding-bottom:2px}
  .linha-live-admin .info{flex:1;min-width:0}
  .linha-live-admin .titulo{font-size:14px;font-weight:700}
  .linha-live-admin .meta{font-size:12px;opacity:.7;margin-top:2px;font-weight:500}
  .badge{
    display:inline-block;font-size:10px;font-weight:700;
    border:2px solid var(--tinta);
    padding:1px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.4px;
  }
  .badge-on{background:var(--verde)}
  .badge-off{background:#ddd;opacity:.7}

  .linha-produto-admin{
    display:flex;align-items:center;gap:10px;
    padding:10px 0;border-bottom:2px dashed #d8d6c9;
  }
  .linha-produto-admin:last-child{border-bottom:none}
  .linha-produto-admin .mini-foto{
    width:46px;height:46px;border:2px solid var(--tinta);border-radius:8px;
    background:#fff;object-fit:contain;flex-shrink:0;
  }
  .linha-produto-admin .nome{flex:1;font-size:13px;line-height:1.3;min-width:0;font-weight:500;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .acoes{display:flex;gap:6px;flex-shrink:0}
  .btn-icone{
    width:32px;height:32px;border:2px solid var(--tinta);border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;background:#fff;
    box-shadow:var(--sombra-p);
    transition:transform .1s, box-shadow .1s;
  }
  .btn-icone:active{transform:translate(2px,2px);box-shadow:none}
  .btn-icone.perigo{background:var(--rosa-claro);color:#B4133F}

  .preview-img{
    margin-top:8px;width:72px;height:72px;object-fit:contain;
    border:2px solid var(--tinta);border-radius:8px;background:#fff;display:none;
  }

  .aviso-demo{
    background:var(--amarelo);border:var(--borda);border-radius:var(--raio-btn);
    box-shadow:var(--sombra-m);
    padding:10px 14px;font-size:12.5px;font-weight:500;
    margin-bottom:20px;line-height:1.5;
  }

  .caixa-add-produto{
    background:#fff;border:2px dashed var(--tinta);border-radius:var(--raio-btn);
    padding:12px;margin-top:12px;
  }

  hr.divisor{border:none;border-top:2px dashed #d8d6c9;margin:16px 0}

  /* Toast */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--tinta);color:#fff;font-size:13.5px;font-weight:700;
    padding:11px 20px;border-radius:100px;
    border:2px solid #fff;box-shadow:var(--sombra-m);
    opacity:0;transition:all .3s;z-index:200;white-space:nowrap;
  }
  .toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0)}

  .senha-box{max-width:360px;margin:60px auto 0;padding:0 16px;position:relative;z-index:1}
  .senha-box .corpo{text-align:center;padding:22px 18px}
  .senha-box .cadeado{font-size:40px;margin-bottom:10px}
  .senha-box h2{font-size:18px;font-weight:700;margin-bottom:16px}

  .link-copiavel{display:flex;gap:8px;margin-top:8px}
  .link-copiavel input{
    flex:1;padding:9px 10px;font-size:12px;font-weight:500;color:#555;
    border:2px dashed var(--tinta);border-radius:8px;background:#fff;outline:none;min-width:0;
  }

  @media(max-width:380px){
    .hero-titulo{font-size:25px}
    .grade{gap:12px}
  }
</style>
</head>
<body>
<span class="estrela e1">✨</span>
<span class="estrela e2">⭐</span>
<span class="estrela e3">💫</span>
<span class="estrela e4">⭐</span>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ================================================================
   LIVES DA RAINHA — minisite estilo arainhadaspromocoes.github.io
   - Home:            #/
   - Página da live:  #/l/nome-da-live
   - Painel:          #/admin
   ================================================================ */

/* ---------- CONFIGURAÇÃO ---------- */
const PERFIL = {
  nome: "A Rainha das Promoções",
  instagram: "@arainhadaspromocoes",
  emoji: "👑"
};
const ADMIN_EMAIL = "vpthais@gmail.com"; // só esta conta Google edita
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6qO04sAW0nPFKg_z40CRXGAC0x4E70dE",
  authDomain: "lives-da-rainha.firebaseapp.com",
  projectId: "lives-da-rainha",
  storageBucket: "lives-da-rainha.firebasestorage.app",
  messagingSenderId: "85874306516",
  appId: "1:85874306516:web:91c45fcfcb65ed602cba41"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
try {
  // Redes de celular às vezes travam a conexão em tempo real;
  // isso faz o Firestore detectar e trocar pra um modo compatível.
  db.settings({ experimentalAutoDetectLongPolling: true, merge: true });
} catch(e){}
const auth = firebase.auth();

const CORES_BARRA = ["barra-amarela","barra-verde","barra-lilas"];

/* ---------- IMAGEM RESERVA ---------- */
function fotoDemo(cor, emoji){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><rect width='300' height='300' fill='${cor}'/><text x='150' y='170' font-size='90' text-anchor='middle'>${emoji}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ---------- ARMAZENAMENTO (Firestore em tempo real + reservas) ---------- */
let memoria = null;          // null = ainda carregando
let configSite = {};         // configurações gerais (ex.: link do botão de promoções)
let tempoRealOk = false;     // true quando o onSnapshot responder
const CHAVE_CACHE = "lives_cache_v2";

function ordenarLives(arr){
  arr.sort((a,b) => String(b.data||"").localeCompare(String(a.data||"")) || (b.criadaEm||0)-(a.criadaEm||0));
  return arr;
}
function separarDocs(docs){
  const cfg = docs.find(d => d.id === "_config");
  configSite = cfg || {};
  return ordenarLives(docs.filter(d => d.id !== "_config"));
}
function guardarCache(){
  try { localStorage.setItem(CHAVE_CACHE, JSON.stringify({ lives: memoria, config: configSite })); } catch(e){}
}

/* Reserva 1: cópia local — abre na hora pra quem já visitou */
try {
  const cache = JSON.parse(localStorage.getItem(CHAVE_CACHE) || "null");
  if (cache && cache.lives) { memoria = ordenarLives(cache.lives); configSite = cache.config || {}; }
} catch(e){}

/* Canal principal: tempo real */
db.collection("lives").onSnapshot(function(snap){
  tempoRealOk = true;
  memoria = separarDocs(snap.docs.map(d => Object.assign({ id: d.id }, d.data())));
  guardarCache();
  rota();
}, function(err){
  console.error(err);
  if (memoria === null) carregarViaRest();
});

/* Reserva 2: busca simples via REST — passa em qualquer rede */
function valorRest(v){
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valorRest);
  if ("mapValue" in v) {
    const o = {}, f = v.mapValue.fields || {};
    for (const k in f) o[k] = valorRest(f[k]);
    return o;
  }
  return null;
}
let buscandoRest = false;
function carregarViaRest(){
  if (buscandoRest || tempoRealOk) return;
  buscandoRest = true;
  fetch("https://firestore.googleapis.com/v1/projects/" + FIREBASE_CONFIG.projectId +
        "/databases/(default)/documents/lives?pageSize=300&key=" + FIREBASE_CONFIG.apiKey)
    .then(r => r.json())
    .then(function(j){
      buscandoRest = false;
      if (tempoRealOk) return; // o tempo real chegou antes, deixa ele mandar
      const docs = (j.documents || []).map(function(d){
        const obj = { id: d.name.split("/").pop() };
        const f = d.fields || {};
        for (const k in f) obj[k] = valorRest(f[k]);
        return obj;
      });
      memoria = separarDocs(docs);
      guardarCache();
      rota();
    })
    .catch(function(){ buscandoRest = false; });
}
/* Se em 5s o tempo real não respondeu, aciona a reserva (e insiste) */
setTimeout(function(){ if (!tempoRealOk) carregarViaRest(); }, 5000);
setInterval(function(){ if (!tempoRealOk && memoria === null) carregarViaRest(); }, 12000);

function carregarLives(){ return memoria || []; }
function erroEscrita(err){
  console.error(err);
  toast(err && err.code === "permission-denied" ? "Sem permissão — entre com a conta da Thais 🔒" : "Erro ao salvar 😕");
}

/* ---------- UTILITÁRIOS ---------- */
function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function gerarSlug(titulo, lives, ignorarId){
  let base = titulo.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "live";
  let slug = base, n = 2;
  while (lives.some(l => l.slug === slug && l.id !== ignorarId)) slug = base + "-" + (n++);
  return slug;
}
function formatarData(iso){
  if(!iso) return "";
  const [a,m,d] = iso.split("-");
  return d + "/" + m + "/" + a;
}
function linkDaLive(slug){
  return location.origin + location.pathname + "#/l/" + slug;
}
function copiarCupom(codigo){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(codigo).then(()=>toast("Cupom " + codigo + " copiado! 🎟️"), ()=>copiarFallback(codigo));
  } else copiarFallback(codigo);
}
function copiar(texto){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(()=>toast("Link copiado! 🎉"), ()=>copiarFallback(texto));
  } else copiarFallback(texto);
}
function copiarFallback(texto){
  const ta = document.createElement("textarea");
  ta.value = texto; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); toast("Link copiado! 🎉"); }catch(e){ toast("Não consegui copiar 😕"); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("mostrar");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("mostrar"), 2200);
}
const FOTO_PADRAO = fotoDemo("#F2F1EA","🛒");
function controles(){ return `<span class="controles"><span>○</span><span>─</span><span>✕</span></span>`; }

/* ---------- SESSÃO ADMIN (login Google) ---------- */
let usuario = null;
let authPronto = false;
auth.onAuthStateChanged(function(u){
  usuario = u;
  authPronto = true;
  if ((location.hash||"").startsWith("#/admin")) rota();
});
function entrarComGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(err){
    if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) {
      auth.signInWithRedirect(provider);
    } else if (err && err.code !== "auth/popup-closed-by-user") {
      console.error(err);
      toast("Não consegui entrar 😕");
    }
  });
}

/* ---------- ROTEADOR ---------- */
function rota(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  window.scrollTo(0,0);
  if (hash.startsWith("#/l/")) {
    telaLive(app, decodeURIComponent(hash.slice(4)));
  } else if (hash.startsWith("#/admin")) {
    telaAdmin(app);
  } else {
    telaHome(app);
  }
}
window.addEventListener("hashchange", rota);

/* Navegação interna sem depender do clique padrão em link
   (visualizadores de prévia às vezes interceptam links) */
document.addEventListener("click", function(e){
  const a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
  if (!a) return;
  e.preventDefault();
  const destino = a.getAttribute("href");
  if (location.hash === destino) rota();
  else location.hash = destino;
});

/* ---------- FOTOS: link ou arquivo enviado (comprimido) ---------- */
let fotoUploadNova = "";    // foto enviada no formulário de adicionar
let fotoUploadEdicao = "";  // foto enviada no formulário de edição

function lerFotoArquivo(input, cb){
  const f = input.files && input.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = function(){
    const img = new Image();
    img.onload = function(){
      const MAX = 420;
      const fator = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * fator));
      const h = Math.max(1, Math.round(img.height * fator));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = function(){ toast("Não consegui ler essa imagem 😕"); };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
  input.value = "";
}
function fotoNovaEscolhida(input){
  lerFotoArquivo(input, function(dataUrl){
    fotoUploadNova = dataUrl;
    const campo = document.getElementById("np-img");
    if (campo) campo.value = "";
    mostrarPreview("np-preview", dataUrl);
    toast("Foto pronta! 📷");
  });
}
function fotoEdicaoEscolhida(input){
  lerFotoArquivo(input, function(dataUrl){
    fotoUploadEdicao = dataUrl;
    const campo = document.getElementById("ed-p-img");
    if (campo) campo.value = "";
    mostrarPreview("ed-p-preview", dataUrl);
    toast("Foto pronta! 📷");
  });
}
function mostrarPreview(id, url){
  const img = document.getElementById(id);
  if (!img) return;
  if (url && url.trim()) { img.src = url.trim(); img.style.display = "block"; }
  else img.style.display = "none";
}
function previewFoto(url){
  fotoUploadNova = "";
  mostrarPreview("np-preview", url);
}
function previewFotoEdicao(url){
  fotoUploadEdicao = "";
  mostrarPreview("ed-p-preview", url);
}

  const lives = carregarLives();
  const live = lives.find(l => l.id === liveAberta);
  if (!live) return;
  const titulo = document.getElementById("ed-titulo").value.trim();
  if (!titulo) { toast("O nome não pode ficar vazio"); return; }
  db.collection("lives").doc(live.id).update({
    titulo,
    data: document.getElementById("ed-data").value,
    cupom: (document.getElementById("ed-cupom").value || "").trim().toUpperCase(),
    slug: gerarSlug(titulo, lives, live.id)
  }).then(()=>toast("Alterações salvas ✅")).catch(erroEscrita);
}
function alternarAtiva(){
  const live = carregarLives().find(l => l.id === liveAberta);
  if (!live) return;
  db.collection("lives").doc(live.id).update({ ativa: !live.ativa })
    .then(()=>toast(!live.ativa ? "Live no ar! 🔴" : "Live oculta 🙈")).catch(erroEscrita);
}
let confirmarExclusao = false;
function excluirLive(){
  const btn = document.getElementById("del-live");
  if (!confirmarExclusao) {
    confirmarExclusao = true;
    btn.textContent = "Tem certeza? Toque de novo";
    setTimeout(()=>{ confirmarExclusao = false; if(document.getElementById("del-live")) document.getElementById("del-live").textContent = "🗑️ Excluir live"; }, 2500);
    return;
  }
  confirmarExclusao = false;
  db.collection("lives").doc(liveAberta).delete()
    .then(function(){ liveAberta = null; toast("Live excluída"); })
    .catch(erroEscrita);
}
function salvarProdutos(live, produtos, msg){
  db.collection("lives").doc(live.id).update({ produtos })
    .then(()=>{ if (msg) toast(msg); }).catch(erroEscrita);
}
function adicionarProduto(){
  const nome = document.getElementById("np-nome").value.trim();
  const url = document.getElementById("np-url").value.trim();
  const img = fotoUploadNova || document.getElementById("np-img").value.trim();
  if (!nome) { toast("Dê um nome pro produto ✍️"); return; }
  if (!url) { toast("Cole o link de afiliado 🔗"); return; }
  const live = carregarLives().find(l => l.id === liveAberta);
  if (!live) return;
  fotoUploadNova = "";
  salvarProdutos(live, (live.produtos||[]).concat([{ nome, url, img }]), "Produto adicionado 🛒");
}
function removerProduto(i){
  const live = carregarLives().find(l => l.id === liveAberta);
  if (!live) return;
  const produtos = (live.produtos||[]).slice();
  produtos.splice(i,1);
  salvarProdutos(live, produtos, "Produto removido");
}
function moverProduto(i, dir){
  const live = carregarLives().find(l => l.id === liveAberta);
  if (!live) return;
  const produtos = (live.produtos||[]).slice();
  const j = i + dir;
  if (j < 0 || j >= produtos.length) return;
  const tmp = produtos[i]; produtos[i] = produtos[j]; produtos[j] = tmp;
  salvarProdutos(live, produtos, null);
}

/* ---------- INICIAR ---------- */
rota();
</script>
